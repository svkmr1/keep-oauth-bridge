<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connecting Keep…</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #050505; color: #f5f5f5;
      display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    main { text-align: center; padding: 2rem; max-width: 22rem; }
    p { color: rgba(245,245,245,0.55); font-size: 0.95rem; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <p id="msg">Returning to Keep…</p>
  </main>
  <script>
    (function () {
      // Preserve query + hash exactly (code, state, error). PKCE verifier stays in the app.
      var q = window.location.search || '';
      var h = window.location.hash || '';
      var deep = 'keep://oauth' + q + h;
      try {
        window.location.replace(deep);
      } catch (e) {}
      // Fallback link if the OS does not hand off automatically
      setTimeout(function () {
        var el = document.getElementById('msg');
        if (!el) return;
        el.innerHTML = 'If Keep did not open, <a href="' + deep.replace(/"/g, '&quot;') + '" style="color:#fff">tap here</a>.';
      }, 1200);
    })();
  </script>
</body>
</html>
